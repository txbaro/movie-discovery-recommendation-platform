services:
  - type: web
    name: movie-discovery-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/app/scripts/start_render.sh
    initialDeployHook: python -m app.scripts.run_collector_scheduler --once
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-discovery-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: movie-discovery-key-value
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        fromService:
          type: web
          name: movie-discovery-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: SQL_ECHO
        value: "false"
      - key: ENABLE_INTERNAL_BOOKING
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GALAXY_COOKIE
        sync: false
      - key: GALAXY_USER_AGENT
        sync: false

  - type: keyvalue
    name: movie-discovery-key-value
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: movie-discovery-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
