services:
  db:
    image: postgres:16
    container_name: movie-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-movie_booking}
    ports:
      - "5432:5432"
    volumes:
      # Lưu data ra ngoài container -> tắt/xóa container không mất data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Cho phép các service khác (vd app) biết khi nào DB thực sự sẵn sàng
      # nhận kết nối, không chỉ là container đã "chạy"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: movie-booking-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # QUAN TRỌNG: bên trong mạng Docker, app không gọi database qua
      # "localhost" (đó là localhost của chính container app, không phải DB).
      # Phải dùng tên SERVICE ("db") làm hostname — Docker Compose tự tạo
      # DNS nội bộ để "db" trỏ đúng tới container database.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-movie_booking}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy  # chờ DB thực sự sẵn sàng, không chỉ "đã chạy"
      redis:
        condition: service_healthy
    volumes:
      # Mount code vào container -> sửa code trên máy thấy hiệu lực ngay
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    # Ghi đè CMD trong Dockerfile: thêm --reload để uvicorn tự khởi động lại
    # mỗi khi phát hiện file .py thay đổi — bắt buộc phải có vì giờ đây
    # Docker LÀ môi trường dev chính, không còn venv chạy song song để reload.
    command: >-
      /bin/sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Process nền độc lập với web server. Kích hoạt có chủ đích bằng:
  # docker compose --profile scheduler up --build
  scheduler:
    build: .
    profiles: ["scheduler"]
    container_name: movie-booking-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-movie_booking}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: python -m app.scripts.run_collector_scheduler

  # Tuỳ chọn: giao diện web để xem/quản lý database trực quan,
  # đỡ phải gõ lệnh SQL thủ công lúc mới học. Bỏ comment nếu muốn dùng.
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: movie-booking-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

  redis:
    image: redis:7-alpine
    container_name: movie-booking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Hạ tầng test cô lập: không dùng volume và không publish port ra host.
  test-db:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movie_booking_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_booking_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-redis:
    image: redis:7-alpine
    profiles: ["test"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  test:
    build: .
    profiles: ["test"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@test-db:5432/movie_booking_test
      REDIS_URL: redis://test-redis:6379/0
      SECRET_KEY: test-only-secret-key
      ENABLE_INTERNAL_BOOKING: "true"
      PYTHONPATH: /app
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pytest.ini:/app/pytest.ini:ro
    command: >-
      /bin/sh -c "alembic upgrade head && pytest"

volumes:
  postgres_data:
