{% extends "base.html" %}
{% block title %}{{ t('auth.register_action') }} - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 24px;">{{ t('auth.register_title') }}</h1>

<form class="auth-form" id="register-form">
    <input type="text" id="full_name" placeholder="{{ t('auth.full_name') }}" required>
    <input type="email" id="email" placeholder="{{ t('common.email') }}" required>
    <input type="password" id="password" placeholder="{{ t('common.password') }}" required minlength="6">
    <button type="submit" class="btn">{{ t('auth.register_action') }}</button>
    <p id="message" class="error-msg"></p>
</form>

<p style="text-align:center; margin-top: 16px;">
    {{ t('auth.has_account') }} <a href="/login">{{ t('auth.login_title') }}</a>
</p>

<script>
const form = document.getElementById("register-form");
const messageEl = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "";

    const full_name = document.getElementById("full_name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const resp = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ full_name, email, password }),
    });

    if (resp.ok) {
        messageEl.className = "success-msg";
        messageEl.textContent = {{ t('auth.register_success')|tojson }};
        setTimeout(() => (window.location.href = "/login"), 1200);
    } else {
        const data = await resp.json();
        messageEl.className = "error-msg";
        messageEl.textContent = data.detail || {{ t('auth.register_failed')|tojson }};
    }
});
</script>
{% endblock %}
