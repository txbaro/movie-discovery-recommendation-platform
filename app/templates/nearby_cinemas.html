{% extends "base.html" %}
{% block title %}{{ t('nearby.title') }} - Movie Discovery{% endblock %}

{% block content %}
<section class="nearby-hero">
    <div>
        <p class="eyebrow">{{ t('nearby.eyebrow') }}</p>
        <h1>{{ t('nearby.heading') }}</h1>
        <p>{{ t('nearby.intro') }}</p>
    </div>
    <button id="locate-button" class="btn" type="button">{{ t('nearby.use_location') }}</button>
</section>

<div class="nearby-controls">
    <label class="filter-field">
        <span>{{ t('semantic.radius') }}</span>
        <select id="radius-select">
            <option value="5">5 km</option>
            <option value="10" selected>10 km</option>
            <option value="25">25 km</option>
            <option value="50">50 km</option>
        </select>
    </label>
    <span class="control-divider">{{ t('nearby.or') }}</span>
    <form id="city-form" class="city-search-form">
        <label class="filter-field">
            <span>{{ t('nearby.city_without_location') }}</span>
            <input id="city-input" placeholder="{{ t('nearby.city_placeholder') }}">
        </label>
        <button class="btn btn-secondary" type="submit">{{ t('nearby.search_city') }}</button>
    </form>
</div>

<div id="nearby-status" class="nearby-status" role="status">
    {{ t('nearby.initial') }}
</div>
<div id="nearby-results" class="nearby-grid"></div>

<script>
const statusBox = document.getElementById("nearby-status");
const resultsBox = document.getElementById("nearby-results");
const locateButton = document.getElementById("locate-button");
const radiusSelect = document.getElementById("radius-select");
const nearbyText = {
    noneTitle: {{ t('nearby.none_title')|tojson }},
    noneHint: {{ t('nearby.none_hint')|tojson }},
    none: {{ t('nearby.none')|tojson }},
    found: {{ t('nearby.found', count='{count}')|tojson }},
    straightLine: {{ t('nearby.straight_line')|tojson }},
    viewShowtimes: {{ t('common.view_showtimes')|tojson }},
    internal: {{ t('common.internal')|tojson }},
    searching: {{ t('nearby.searching')|tojson }},
    loading: {{ t('nearby.loading')|tojson }},
    loadFailed: {{ t('nearby.load_failed')|tojson }},
    tryAgain: {{ t('common.try_again')|tojson }},
    geoUnsupported: {{ t('nearby.geo_unsupported')|tojson }},
    geoRequest: {{ t('nearby.geo_request')|tojson }},
    geoDenied: {{ t('nearby.geo_denied')|tojson }},
    geoUnavailable: {{ t('nearby.geo_unavailable')|tojson }},
    geoTimeout: {{ t('nearby.geo_timeout')|tojson }},
    geoFailed: {{ t('nearby.geo_failed')|tojson }},
    cityRequired: {{ t('nearby.city_required')|tojson }},
};

function escapeHtml(value) {
    const node = document.createElement("div");
    node.textContent = value ?? "";
    return node.innerHTML;
}

function providerClass(source) {
    return ["cgv", "galaxy", "cinestar", "fixture"].includes(source)
        ? `source-${source}` : "";
}

function renderCinemas(cinemas, usesLocation) {
    if (cinemas.length === 0) {
        resultsBox.innerHTML = `<div class="empty-state"><span>📍</span><h3>${nearbyText.noneTitle}</h3><p>${nearbyText.noneHint}</p></div>`;
        statusBox.textContent = nearbyText.none;
        return;
    }
    statusBox.textContent = nearbyText.found.replace("{count}", cinemas.length);
    resultsBox.innerHTML = cinemas.map((cinema, index) => `
        <article class="nearby-card">
            <div class="nearby-rank">${index + 1}</div>
            <div class="nearby-card-content">
                <span class="source-badge ${providerClass(cinema.source)}">${escapeHtml(cinema.source || nearbyText.internal)}</span>
                <h2>${escapeHtml(cinema.name)}</h2>
                <p>${escapeHtml(cinema.address)}</p>
                <p class="nearby-city">${escapeHtml(cinema.city)}</p>
            </div>
            <div class="nearby-card-action">
                ${usesLocation && cinema.distance_km !== null
                    ? `<strong>${cinema.distance_km.toFixed(2)} km</strong><small>${nearbyText.straightLine}</small>`
                    : ""}
                <a class="btn" href="/cinema/${cinema.id}">${nearbyText.viewShowtimes}</a>
            </div>
        </article>
    `).join("");
}

async function loadCinemas(params, usesLocation) {
    statusBox.textContent = nearbyText.searching;
    resultsBox.innerHTML = `<div class="loading-card">${nearbyText.loading}</div>`;
    params.set("has_upcoming_showtimes", "true");
    params.set("limit", "100");
    try {
        const response = await fetch(`/cinemas?${params.toString()}`);
        if (!response.ok) throw new Error(nearbyText.loadFailed);
        renderCinemas(await response.json(), usesLocation);
    } catch (error) {
        resultsBox.innerHTML = "";
        statusBox.textContent = `${error.message}. ${nearbyText.tryAgain}.`;
        statusBox.classList.add("error-msg");
    }
}

locateButton.addEventListener("click", () => {
    if (!navigator.geolocation) {
        statusBox.textContent = nearbyText.geoUnsupported;
        return;
    }
    locateButton.disabled = true;
    statusBox.classList.remove("error-msg");
    statusBox.textContent = nearbyText.geoRequest;
    navigator.geolocation.getCurrentPosition(
        ({coords}) => {
            const params = new URLSearchParams({
                latitude: coords.latitude.toString(),
                longitude: coords.longitude.toString(),
                radius_km: radiusSelect.value,
            });
            loadCinemas(params, true).finally(() => { locateButton.disabled = false; });
        },
        (error) => {
            const messages = {
                1: nearbyText.geoDenied,
                2: nearbyText.geoUnavailable,
                3: nearbyText.geoTimeout,
            };
            statusBox.textContent = messages[error.code] || nearbyText.geoFailed;
            locateButton.disabled = false;
        },
        {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000},
    );
});

document.getElementById("city-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const city = document.getElementById("city-input").value.trim();
    if (!city) {
        statusBox.textContent = nearbyText.cityRequired;
        return;
    }
    loadCinemas(new URLSearchParams({city}), false);
});
</script>
{% endblock %}
