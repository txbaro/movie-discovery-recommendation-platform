<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Discovery{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
    window.trackBehavior = function(payload) {
        return fetch("/events", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload),
            credentials: "same-origin",
            keepalive: true,
        }).catch(() => null);
    };
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">🎬 Movie Discovery</a>
        <div class="navbar-links">
            <a href="/nearby-cinemas">{{ t('nav.nearby') }}</a>

            <span class="language-switch" aria-label="{{ t('language.label') }}">
                <a href="/language/vi" data-language="vi" {% if locale == 'vi' %}aria-current="true"{% endif %}>VI</a>
                <span>/</span>
                <a href="/language/en" data-language="en" {% if locale == 'en' %}aria-current="true"{% endif %}>EN</a>
            </span>

            <span id="guest-links">
                <a href="/login">{{ t('nav.login') }}</a>
                <a href="/register">{{ t('nav.register') }}</a>
            </span>

            <span id="user-links" style="display:none;">
                <a href="/profile" id="user-name" class="user-profile-link" aria-label="{{ t('nav.profile') }}"></a>
                <a href="#" id="logout-link">{{ t('nav.logout') }}</a>
            </span>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
    document.querySelectorAll("[data-language]").forEach((link) => {
        link.href = `/language/${link.dataset.language}?next=${encodeURIComponent(location.pathname + location.search)}`;
    });

    // Chạy trên MỌI trang (nhờ đặt trong base.html) — kiểm tra trạng thái
    // đăng nhập bằng cách gọi GET /auth/me. Cookie JWT tự động gửi kèm
    // (same-origin), không cần code thêm gì để đính token.
    (async function checkAuthStatus() {
        try {
            const resp = await fetch("/auth/me");
            if (resp.ok) {
                const user = await resp.json();
                document.getElementById("guest-links").style.display = "none";
                document.getElementById("user-links").style.display = "inline";
                const userName = document.getElementById("user-name");
                userName.textContent = user.full_name;
                userName.setAttribute("aria-label", `Quản lý hồ sơ của ${user.full_name}`);
            }
            // Nếu resp không ok (401 - chưa đăng nhập): giữ nguyên trạng thái
            // mặc định của HTML (guest-links đã hiện sẵn), không cần làm gì.
        } catch (err) {
            // Lỗi mạng/server: im lặng giữ trạng thái mặc định (guest),
            // không chặn người dùng xem trang chỉ vì lỗi kiểm tra auth.
        }
    })();

    document.getElementById("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/auth/logout", { method: "POST" });
        window.location.href = "/";
    });

    document.addEventListener("click", (event) => {
        const movieLink = event.target.closest("[data-track-movie-id]");
        if (movieLink) {
            window.trackBehavior({
                event_type: "movie_viewed",
                movie_id: Number(movieLink.dataset.trackMovieId),
            });
            if (movieLink.dataset.recommendationContext) {
                window.trackBehavior({
                    event_type: "recommendation_clicked",
                    movie_id: Number(movieLink.dataset.trackMovieId),
                    context_id: movieLink.dataset.recommendationContext,
                });
            }
        }
        const externalLink = event.target.closest("[data-track-showtime-id]");
        if (externalLink) {
            window.trackBehavior({
                event_type: "external_booking_clicked",
                showtime_id: Number(externalLink.dataset.trackShowtimeId),
            });
        }
    });

    const discoveryForm = document.getElementById("discovery-form");
    if (discoveryForm) {
        discoveryForm.addEventListener("submit", () => {
            const searchQuery = discoveryForm.elements.title.value.trim();
            if (searchQuery) {
                window.trackBehavior({
                    event_type: "movie_searched",
                    search_query: searchQuery,
                });
            }
        });
    }
    </script>
</body>
</html>
