{% extends "base.html" %}
{% block title %}{{ t('auth.reset_title') }} - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 24px;">{{ t('auth.reset_title') }}</h1>

{% if not token %}
<p class="error-msg" style="text-align:center;">
    {{ t('auth.invalid_link') }} <a href="/forgot-password">{{ t('auth.forgot_page') }}</a>.
</p>
{% else %}
<form class="auth-form" id="reset-form">
    <input type="hidden" id="token" value="{{ token }}">
    <input type="password" id="new_password" placeholder="{{ t('auth.new_password') }}" required minlength="6">
    <button type="submit" class="btn">{{ t('auth.reset_action') }}</button>
    <p id="message" class="error-msg"></p>
</form>
{% endif %}

<script>
const form = document.getElementById("reset-form");
if (form) {
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const token = document.getElementById("token").value;
        const new_password = document.getElementById("new_password").value;

        const resp = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password }),
        });

        const data = await resp.json();

        if (resp.ok) {
            messageEl.className = "success-msg";
            messageEl.textContent = {{ t('auth.reset_success')|tojson }};
            setTimeout(() => (window.location.href = "/login"), 1500);
        } else {
            messageEl.className = "error-msg";
            messageEl.textContent = data.detail || {{ t('auth.reset_failed')|tojson }};
        }
    });
}
</script>
{% endblock %}
