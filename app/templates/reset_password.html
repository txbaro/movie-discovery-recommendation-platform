{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 24px;">Đặt lại mật khẩu</h1>

{% if not token %}
<p class="error-msg" style="text-align:center;">
    Link không hợp lệ. Vui lòng thử lại từ <a href="/forgot-password">trang quên mật khẩu</a>.
</p>
{% else %}
<form class="auth-form" id="reset-form">
    <input type="hidden" id="token" value="{{ token }}">
    <input type="password" id="new_password" placeholder="Mật khẩu mới" required minlength="6">
    <button type="submit" class="btn">Đặt lại mật khẩu</button>
    <p id="message" class="error-msg"></p>
</form>
{% endif %}

<script>
const form = document.getElementById("reset-form");
if (form) {
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const token = document.getElementById("token").value;
        const new_password = document.getElementById("new_password").value;

        const resp = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password }),
        });

        const data = await resp.json();

        if (resp.ok) {
            messageEl.className = "success-msg";
            messageEl.textContent = data.message + " Đang chuyển đến trang đăng nhập...";
            setTimeout(() => (window.location.href = "/login"), 1500);
        } else {
            messageEl.className = "error-msg";
            messageEl.textContent = data.detail || "Đặt lại mật khẩu thất bại.";
        }
    });
}
</script>
{% endblock %}
