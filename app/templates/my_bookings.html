{% extends "base.html" %}
{% block title %}{{ t('bookings.title') }} - Movie Discovery{% endblock %}

{% block content %}
<h1 style="margin-bottom: 24px;">{{ t('bookings.title') }}</h1>

<div id="booking-list" class="booking-list">
    <p>{{ t('bookings.loading') }}</p>
</div>

<script>
const bookingText = {
    empty: {{ t('bookings.empty')|tojson }},
    browse: {{ t('bookings.browse')|tojson }},
    seats: {{ t('bookings.seats')|tojson }},
    bookedAt: {{ t('bookings.booked_at')|tojson }},
    locale: {{ ('en-US' if locale == 'en' else 'vi-VN')|tojson }},
};
async function loadBookings() {
    const resp = await fetch("/bookings/me");

    if (resp.status === 401) {
        window.location.href = "/login";
        return;
    }

    const bookings = await resp.json();
    const listEl = document.getElementById("booking-list");

    if (bookings.length === 0) {
        listEl.innerHTML = `<p>${bookingText.empty} <a href='/'>${bookingText.browse}</a>.</p>`;
        return;
    }

    listEl.innerHTML = bookings.map((b) => `
        <div class="booking-item">
            <div>
                <strong>${b.movie_title}</strong><br>
                <span style="color:#6b6b6b; font-size:0.9rem;">
                    ${bookingText.seats} ${b.seats.map((seat) => seat.seat_label).join(", ")}
                </span>
            </div>
            <div style="color:#6b6b6b; font-size:0.85rem;">
                ${bookingText.bookedAt}: ${new Date(b.booked_at).toLocaleString(bookingText.locale)}
            </div>
        </div>
    `).join("");
}

loadBookings();
</script>
{% endblock %}
