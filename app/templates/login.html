{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }} - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 24px;">{{ t('auth.login_title') }}</h1>

<form class="auth-form" id="login-form">
    <input type="email" id="email" placeholder="{{ t('common.email') }}" required>
    <input type="password" id="password" placeholder="{{ t('common.password') }}" required>
    <button type="submit" class="btn">{{ t('auth.login_title') }}</button>
    <p id="message" class="error-msg"></p>
</form>

<p style="text-align:center; margin-top: 16px;">
    {{ t('auth.no_account') }} <a href="/register">{{ t('auth.register_action') }}</a>
</p>
<p style="text-align:center; margin-top: 8px;">
    <a href="/forgot-password">{{ t('auth.forgot') }}</a>
</p>

<script>
const form = document.getElementById("login-form");
const messageEl = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const resp = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
    });

    if (resp.ok) {
        window.location.href = "/";
    } else {
        const data = await resp.json();
        messageEl.textContent = data.detail || {{ t('auth.login_failed')|tojson }};
    }
});
</script>
{% endblock %}
