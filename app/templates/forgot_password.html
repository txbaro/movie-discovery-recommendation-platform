{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_title') }} - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 12px;">{{ t('auth.forgot_title') }}</h1>
<p style="text-align:center; color:#6b6b6b; margin-bottom: 24px;">
    {{ t('auth.forgot_intro') }}
</p>

<form class="auth-form" id="forgot-form">
    <input type="email" id="email" placeholder="{{ t('common.email') }}" required>
    <button type="submit" class="btn">{{ t('auth.send_reset') }}</button>
    <p id="message"></p>
</form>

<p style="text-align:center; margin-top: 16px;">
    <a href="/login">{{ t('common.back_login') }}</a>
</p>

<script>
const form = document.getElementById("forgot-form");
const messageEl = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;

    const resp = await fetch("/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
    });

    await resp.json();
    messageEl.className = "success-msg";
    messageEl.textContent = {{ t('auth.reset_sent')|tojson }};
});
</script>
{% endblock %}
