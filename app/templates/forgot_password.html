{% extends "base.html" %}
{% block title %}Quên mật khẩu - Movie Discovery{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-bottom: 12px;">Quên mật khẩu</h1>
<p style="text-align:center; color:#6b6b6b; margin-bottom: 24px;">
    Nhập email, chúng tôi sẽ gửi link đặt lại mật khẩu.
</p>

<form class="auth-form" id="forgot-form">
    <input type="email" id="email" placeholder="Email" required>
    <button type="submit" class="btn">Gửi link đặt lại</button>
    <p id="message"></p>
</form>

<p style="text-align:center; margin-top: 16px;">
    <a href="/login">Quay lại đăng nhập</a>
</p>

<script>
const form = document.getElementById("forgot-form");
const messageEl = document.getElementById("message");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;

    const resp = await fetch("/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
    });

    const data = await resp.json();
    messageEl.className = "success-msg";
    messageEl.textContent = data.message;
});
</script>
{% endblock %}
